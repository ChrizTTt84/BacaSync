name: Build BacaSync (Multiplataforma)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pack_script: npm run pack:win
            artifact_os: windows
            upload_name: BacaSync-Windows
          - os: macos-latest
            pack_script: npm run pack:mac
            artifact_os: macos
            upload_name: BacaSync-macOS
          - os: ubuntu-latest
            pack_script: npm run pack:linux
            artifact_os: linux
            upload_name: BacaSync-Linux

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar TypeScript
        run: npm run build

      - name: Empaquetar app (${{ matrix.artifact_os }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CI: 'true'
        run: ${{ matrix.pack_script }}

      - name: Subir artefactos (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.upload_name }}
          path: |
            release/*Setup*.exe
            release/*Portable*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
            release/latest*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Subir artefactos a Release (solo tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*Setup*.exe
            release/*Portable*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
            release/latest*.json
          fail_on_unmatched_files: false
          generate_release_notes: true
