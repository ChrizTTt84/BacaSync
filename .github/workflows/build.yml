name: Build BacaSync (Windows + macOS)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: (Debug) Listar assets / repo
        shell: bash
        run: |
          echo "=== Root ==="
          ls -la || true
          echo "=== assets/ (si existe) ==="
          ls -la assets/ 2>/dev/null || echo "(assets/ NO existe - el package.json lo tolera con || true)"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm install

      - name: Compilar TypeScript
        run: npm run build

      - name: Empaquetar Windows x64 (NSIS + Portable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CI: 'true'
        run: npm run pack:win

      - name: (Debug) Listar carpeta release
        shell: bash
        run: |
          echo "=== Contenido de release/ (maxDepth 3) ==="
          ls -lah release/ 2>/dev/null || echo "(vacia o no existe)"
          find release -maxdepth 3 -type f 2>/dev/null || true
          echo "=== Buscando instalables EXACTO ==="
          find release -maxdepth 3 -type f \( -iname "*.exe" -o -iname "*.dmg" -o -iname "*.blockmap" -o -iname "latest*.yml" -o -iname "latest*.json" \) 2>/dev/null || true

      - name: Preparar artifacts (copiar todos los instalables a carpeta plana artifacts/)
        shell: bash
        run: |
          mkdir -p artifacts
          echo "=== Copiando archivos a artifacts/ ==="
          find release -maxdepth 3 -type f \( -iname "*.exe" -o -iname "*.dmg" -o -iname "*.blockmap" -o -iname "latest*.yml" -o -iname "latest*.json" \) -print0 | while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            dest="artifacts/$base"
            if [ -f "$dest" ]; then
              echo "(ya existe, skip) $dest"
            else
              echo "cp $f -> $dest"
              cp -f "$f" "$dest"
            fi
          done
          echo "=== Contenido final artifacts/ ==="
          ls -lah artifacts/ 2>/dev/null || echo "(vacia)"

      - name: Subir artefactos Windows
        uses: actions/upload-artifact@v4
        with:
          name: BacaSync-Windows-x64
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 30

      - name: Subir a Release (solo tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/*.yml
            artifacts/*.json
          fail_on_unmatched_files: false
          generate_release_notes: true

  
  build-mac-arm64:
    name: Build macOS Apple Silicon (arm64 M1/M2/M3/M4)
    runs-on: macos-14
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: (Debug) Listar assets / repo
        shell: bash
        run: |
          echo "=== Root ==="
          ls -la || true
          echo "=== assets/ (si existe) ==="
          ls -la assets/ 2>/dev/null || echo "(assets/ NO existe - el package.json lo tolera con || true)"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm install

      - name: Compilar TypeScript
        run: npm run build

      - name: Empaquetar macOS arm64 (Apple Silicon - SIN Rosetta)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CI: 'true'
        run: npm run pack:mac-arm64

      - name: (Debug) Listar carpeta release
        shell: bash
        run: |
          echo "=== Contenido de release/ (maxDepth 3) ==="
          ls -lah release/ 2>/dev/null || echo "(vacia o no existe)"
          find release -maxdepth 3 -type f 2>/dev/null || true
          echo "=== Buscando instalables EXACTO ==="
          find release -maxdepth 3 -type f \( -iname "*.exe" -o -iname "*.dmg" -o -iname "*.blockmap" -o -iname "latest*.yml" -o -iname "latest*.json" \) 2>/dev/null || true

      - name: Preparar artifacts (copiar todos los instalables a carpeta plana artifacts/)
        shell: bash
        run: |
          mkdir -p artifacts
          echo "=== Copiando archivos a artifacts/ ==="
          find release -maxdepth 3 -type f \( -iname "*.exe" -o -iname "*.dmg" -o -iname "*.blockmap" -o -iname "latest*.yml" -o -iname "latest*.json" \) -print0 | while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            dest="artifacts/$base"
            if [ -f "$dest" ]; then
              echo "(ya existe, skip) $dest"
            else
              echo "cp $f -> $dest"
              cp -f "$f" "$dest"
            fi
          done
          echo "=== Contenido final artifacts/ ==="
          ls -lah artifacts/ 2>/dev/null || echo "(vacia)"

      - name: Subir artefactos macOS Apple Silicon
        uses: actions/upload-artifact@v4
        with:
          name: BacaSync-macOS-arm64-AppleSilicon
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 30

      - name: Subir a Release (solo tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.blockmap
            artifacts/*.yml
            artifacts/*.json
          fail_on_unmatched_files: false
          generate_release_notes: true
