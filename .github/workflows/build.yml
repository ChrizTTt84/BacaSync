name: Build BacaSync (Multiplataforma)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pack_script: npm run pack:win
            artifact_os: windows
            upload_name: BacaSync-Windows
          - os: macos-latest
            pack_script: npm run pack:mac
            artifact_os: macos
            upload_name: BacaSync-macOS
          - os: ubuntu-latest
            pack_script: npm run pack:linux
            artifact_os: linux
            upload_name: BacaSync-Linux

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libasound2 libatk1.0-0 libatk-bridge2.0-0 \
            libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 \
            libgcc1 libglib2.0-0 libgtk-3-0 libnspr4 libpango-1.0-0 libx11-6 \
            libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 \
            libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm install

      - name: Compilar TypeScript
        run: npm run build

      - name: Empaquetar app (${{ matrix.artifact_os }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CI: 'true'
        run: ${{ matrix.pack_script }}

      - name: (Debug) Listar carpeta release
        shell: bash
        run: |
          echo "=== Contenido de release/ ==="
          ls -lah release/ 2>/dev/null || echo "(carpeta release no existe o vacia)"
          echo "=== Listado recursivo ==="
          find release -maxdepth 3 -type f 2>/dev/null || true

      - name: Subir artefactos (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.upload_name }}
          path: |
            release/*.exe
            release/*.msi
            release/*.dmg
            release/*.pkg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.snap
            release/*.tar.gz
            release/*.zip
            release/*.blockmap
            release/latest*.yml
            release/latest*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Subir artefactos a Release (solo tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.msi
            release/*.dmg
            release/*.pkg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.snap
            release/*.tar.gz
            release/*.zip
            release/*.blockmap
            release/latest*.yml
            release/latest*.json
          fail_on_unmatched_files: false
          generate_release_notes: true
