name: Build BacaSync (Windows + macOS)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm install

      - name: Compilar TypeScript
        run: npm run build

      - name: Empaquetar Windows x64 (NSIS + Portable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CI: 'true'
        run: npm run pack:win

      - name: (Debug) Listar carpeta release
        shell: bash
        run: |
          echo "=== Contenido de release/ ==="
          ls -lah release/ 2>/dev/null || echo "(vacia o no existe)"
          find release -maxdepth 2 -type f 2>/dev/null || true

      - name: Subir artefactos Windows
        uses: actions/upload-artifact@v4
        with:
          name: BacaSync-Windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/latest*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Subir a Release (solo tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/latest*.json
          fail_on_unmatched_files: false
          generate_release_notes: true

  build-mac-x64:
    name: Build macOS Intel (x64)
    runs-on: macos-13
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm install

      - name: Compilar TypeScript
        run: npm run build

      - name: Empaquetar macOS x64 (Intel)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CI: 'true'
        run: npm run pack:mac-x64

      - name: (Debug) Listar carpeta release
        shell: bash
        run: |
          echo "=== Contenido de release/ ==="
          ls -lah release/ 2>/dev/null || echo "(vacia o no existe)"
          find release -maxdepth 2 -type f 2>/dev/null || true

      - name: Subir artefactos macOS Intel
        uses: actions/upload-artifact@v4
        with:
          name: BacaSync-macOS-x64-Intel
          path: |
            release/*.dmg
            release/*.blockmap
            release/latest*.yml
            release/latest*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Subir a Release (solo tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.blockmap
            release/latest*.yml
            release/latest*.json
          fail_on_unmatched_files: false
          generate_release_notes: true

  build-mac-arm64:
    name: Build macOS Apple Silicon (arm64 M1/M2/M3/M4)
    runs-on: macos-14
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm install

      - name: Compilar TypeScript
        run: npm run build

      - name: Empaquetar macOS arm64 (Apple Silicon - SIN Rosetta)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CI: 'true'
        run: npm run pack:mac-arm64

      - name: (Debug) Listar carpeta release
        shell: bash
        run: |
          echo "=== Contenido de release/ ==="
          ls -lah release/ 2>/dev/null || echo "(vacia o no existe)"
          find release -maxdepth 2 -type f 2>/dev/null || true

      - name: Subir artefactos macOS Apple Silicon
        uses: actions/upload-artifact@v4
        with:
          name: BacaSync-macOS-arm64-AppleSilicon
          path: |
            release/*.dmg
            release/*.blockmap
            release/latest*.yml
            release/latest*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Subir a Release (solo tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.blockmap
            release/latest*.yml
            release/latest*.json
          fail_on_unmatched_files: false
          generate_release_notes: true
